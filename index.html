<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">


    <title>Frontend Mentor | Results summary component</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="../Style/style.css">

</head>

<body>

    <div class="main">

        <div class="result">

            <h4>Your Result</h4>

            <div class="score">

                <h1>76</h1>

                <p>of 100</p>

            </div>

            <div class="text-result">

                <h3>Great</h3>

                <p>You scored higher than 65% of the people who have taken these tests.</p>

            </div>

        </div>

        <div class="summary">

            <h4>Summary</h4>

            <ul>

                <li class="list-1 list">

                    <div class="item-left">

                        <img src="../assets/images/icon-reaction.svg" alt="Reaction">

                        <span class="reaction">Reaction</span>

                    </div>

                    <div class="item-right">

                        <span>80</span>/ 100

                    </div>

                </li>

                <li class="list-2 list">

                    <div class="item-left">

                        <img src="../assets/images/icon-memory.svg" alt="Memory">

                        <span class="memory">Memory</span>

                    </div>

                    <div class="item-right">

                        <span>92</span>/ 100

                    </div>

                </li>

                <li class="list-3 list">

                    <div class="item-left">

                        <img src="../assets/images/icon-verbal.svg" alt="Verbal">

                        <span class="verbal">Verbal</span>

                    </div>

                    <div class="item-right">

                        <span>61</span>/ 100

                    </div>

                </li>

                <li class="list-4 list">

                    <div class="item-left">

                        <img src="../assets/images/icon-visual.svg" alt="Visual">

                        <span class="visual">Visual</span>

                    </div>

                    <div class="item-right">

                        <span>73</span>/ 100

                    </div>

                </li>

            </ul>

            <button>Continue</button>

        </div>

    </div>


    <div class="attribution">

        Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank">Frontend Mentor</a>.

        Coded by <a href="#">Arkar-Tun</a>.

    </div>

    <script src="../JavaScript/Script.js"></script>

</body>

</html>
